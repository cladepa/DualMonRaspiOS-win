# Общие настройки второго монитора (читает Pi). Правится руками, bash-синтаксис.
APP_NAME="Second Monitor"      # имя приложения в Apollo (вкладка Applications)
RESOLUTION="--1080"            # --720 / --1080 / --1440
FPS=60                         # 30 даёт рывки курсора, оставь 60
BITRATE_LAN=12000              # Кбит/с, для локальной сети
BITRATE_WAN=6000               # Кбит/с, для ZeroTier и прочих адресов не из LAN
CODEC="H.264"                  # на Pi 4 аппаратно работает только H.264
APOLLO_PORT=47989              # порт Apollo/Sunshine для проверки доступности
RECONNECT_MAX_SEC=600          # сколько секунд пытаться восстановить стрим после обрыва связи
